services:
  app:
    build: .
    restart: unless-stopped
    environment:
      AUTH_USER: ${AUTH_USER}
      AUTH_PASS: ${AUTH_PASS}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      PORT: 8080
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
